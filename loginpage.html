
<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr. Iqas - Neon Lamp Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Arial, sans-serif;
}

body {
    background: #020711;
    color: white;
    min-height: 100vh;
    overflow: hidden;
}

.scene {
    position: relative;
    width: 100%;
    height: 100vh;
    min-height: 600px;
    display: flex;
    align-items: center;
    justify-content: space-around;
    overflow: hidden;
    background:
        radial-gradient(ellipse at 28% 70%, rgba(0,100,220,.12), transparent 45%),
        radial-gradient(ellipse at 75% 50%, rgba(0,80,255,.08), transparent 45%),
        #020711;
}

/* BACKGROUND PARTICLES */

.particles {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
}

.particle {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #38cfff;
    box-shadow: 0 0 10px #00aaff;
    animation: float 7s infinite ease-in-out;
}

@keyframes float {
    0%, 100% {
        transform: translateY(0);
        opacity: .2;
    }
    50% {
        transform: translateY(-35px);
        opacity: .9;
    }
}

/* LAMP SECTION */

.lamp-section {
    position: relative;
    width: 45%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.lamp {
    position: relative;
    width: 300px;
    height: 540px;
    z-index: 5;
}

/* LAMP STAND */

.lamp-stand {
    position: absolute;
    bottom: 35px;
    left: 50%;
    transform: translateX(-50%);
    width: 8px;
    height: 310px;
    border-radius: 10px;
    background: linear-gradient(
        90deg,
        #111923,
        #566c82,
        #111923
    );
}

/* LAMP BASE */

.lamp-base {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 195px;
    height: 32px;
    border-radius: 50%;
    background: linear-gradient(
        180deg,
        #34485a,
        #101720 50%,
        #03070d
    );
    border: 1px solid #30475b;
    box-shadow: 0 8px 20px #000;
}

/* LAMP HEAD */

.lamp-head {
    position: absolute;
    left: 50%;
    top: 65px;
    transform: translateX(-50%);
    width: 215px;
    height: 135px;
    border-radius: 110px 110px 30px 30px;
    background: linear-gradient(
        145deg,
        #304257,
        #101923 65%,
        #050b12
    );
    border: 1px solid #30465b;
    box-shadow:
        inset -12px -12px 20px #03080e,
        0 0 15px rgba(0,100,200,.2);
    z-index: 6;
}

.lamp-head::before {
    content: "";
    position: absolute;
    bottom: -7px;
    left: 4px;
    width: 205px;
    height: 13px;
    border-radius: 50%;
    background: linear-gradient(
        90deg,
        #182b40,
        #a9eaff,
        #182b40
    );
}

/* BULB */

.lamp-bulb {
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    width: 75px;
    height: 12px;
    border-radius: 50%;
    background: #a6ffff;
    box-shadow:
        0 0 15px #00eaff,
        0 0 35px #00bfff,
        0 0 65px #008cff;
    transition: .5s;
}

/* PULL CHAIN */

.chain {
    position: absolute;
    top: 195px;
    left: 62%;
    width: 20px;
    height: 85px;
    z-index: 20;
    cursor: grab;
    touch-action: none;
    user-select: none;
    transform: translateY(0);
    transition: transform .25s ease;
}

.chain::before {
    content: "";
    position: absolute;
    left: 9px;
    top: 0;
    width: 2px;
    height: 100%;
    background: linear-gradient(
        #b4e9ff,
        #526d80
    );
}

.chain-ball {
    position: absolute;
    bottom: -7px;
    left: 3px;
    width: 15px;
    height: 17px;
    border-radius: 50%;
    background: radial-gradient(
        circle at 35% 30%,
        #ffffff,
        #6ceaff 35%,
        #0084c9 75%,
        #003b6b
    );
    border: 1px solid #8beaff;
    box-shadow:
        0 0 8px #00cfff,
        0 0 18px rgba(0,200,255,.5);
    cursor: grab;
    touch-action: none;
}

.chain.pulling {
    transition: none;
}

.chain.pulling .chain-ball {
    cursor: grabbing;
    box-shadow:
        0 0 15px #00eaff,
        0 0 30px #00cfff;
}

/* LIGHT CONE */

.light-cone {
    position: absolute;
    top: 195px;
    left: 50%;
    transform: translateX(-50%);
    width: 450px;
    height: 350px;
    background: linear-gradient(
        180deg,
        rgba(0,225,255,.38),
        rgba(0,140,255,.15) 50%,
        transparent
    );
    clip-path: polygon(
        42% 0,
        58% 0,
        100% 100%,
        0 100%
    );
    filter: blur(12px);
    opacity: 1;
    transition: opacity .8s;
    pointer-events: none;
}

/* FLOOR LIGHT */

.floor-light {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 450px;
    height: 45px;
    background: #00bfff;
    filter: blur(35px);
    border-radius: 50%;
    opacity: .45;
    transition: opacity .8s;
}

/* LOGIN SECTION */

.login-section {
    width: 390px;
    max-width: 90%;
    margin-right: 7%;
    z-index: 10;
    opacity: 1;
    visibility: visible;
    transform: translateY(0) scale(1);
    transition:
        opacity .8s ease,
        transform .8s ease,
        visibility .8s;
}

.login-card {
    position: relative;
    padding: 38px 32px;
    border-radius: 22px;
    background: rgba(8,23,43,.78);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(0,174,255,.6);
    box-shadow:
        0 0 25px rgba(0,140,255,.18),
        inset 0 0 25px rgba(0,140,255,.06);
    animation: glow 3s infinite alternate;
}

@keyframes glow {
    from {
        box-shadow: 0 0 15px rgba(0,140,255,.15);
    }
    to {
        box-shadow: 0 0 30px rgba(0,140,255,.3);
    }
}

/* MR. IQAS ROBOT LOGO */

.lock-icon {
    width: 55px;
    height: 55px;
    margin: 0 auto 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border: 1px solid #00d9ff;
    border-radius: 15px;
    background: #020b19;
    box-shadow:
        0 0 12px rgba(0,200,255,.45),
        0 0 25px rgba(0,200,255,.2);
}

.lock-icon svg {
    width: 48px;
    height: 48px;
    display: block;
}

/* TITLE */

h1 {
    text-align: center;
    font-size: 30px;
    margin-bottom: 8px;
}

h1 span {
    color: #00cfff;
}

.subtitle {
    text-align: center;
    color: #9bb8d0;
    font-size: 13px;
    margin-bottom: 30px;
}

/* INPUT */

.input-group {
    position: relative;
    margin-bottom: 17px;
}

.input-group input {
    width: 100%;
    height: 53px;
    padding: 0 45px;
    color: white;
    background: rgba(2,12,25,.7);
    border: 1px solid #284d70;
    border-radius: 12px;
    outline: none;
    font-size: 14px;
    transition: .3s;
}

.input-group input::placeholder {
    color: #9ab6d2;
}

.input-group input:focus {
    border-color: #00cfff;
    box-shadow: 0 0 15px rgba(0,190,255,.2);
}

.input-icon {
    position: absolute;
    left: 15px;
    top: 16px;
    color: #8dcfff;
    font-size: 18px;
}

.eye {
    position: absolute;
    right: 15px;
    top: 17px;
    color: #9dcfff;
    cursor: pointer;
}

/* SIGN IN BUTTON */

.sign-btn {
    width: 100%;
    height: 53px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(
        100deg,
        #00d9ed,
        #0864ff
    );
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 5px;
    box-shadow: 0 5px 20px rgba(0,130,255,.3);
    transition: .3s;
}

.sign-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 5px 30px rgba(0,200,255,.55);
}

/* SWITCH TEXT */

.switch-text {
    margin-top: 20px;
    text-align: center;
    color: #9bb8d0;
    font-size: 13px;
}

.text-btn {
    border: 0;
    background: transparent;
    color: #00d9ff;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    margin-left: 4px;
}

.text-btn:hover {
    text-decoration: underline;
}

.hidden-view {
    display: none;
}

#registerView .subtitle {
    margin-bottom: 22px;
}

#registerView .input-group {
    margin-bottom: 12px;
}

#registerView .input-group input {
    height: 48px;
}

#registerView .sign-btn {
    margin-top: 8px;
}

.message {
    text-align: center;
    color: #55dfff;
    font-size: 12px;
    min-height: 18px;
    margin-top: 15px;
}

/* LAMP OFF */

.scene.lamp-off .login-section {
    opacity: 0;
    visibility: hidden;
    transform: translateY(35px) scale(.92);
    pointer-events: none;
}

.scene.lamp-off .light-cone,
.scene.lamp-off .floor-light {
    opacity: 0;
}

.scene.lamp-off .lamp-bulb {
    background: #263746;
    box-shadow: none;
}

.scene.lamp-off .chain-ball {
    background: #34495a;
    box-shadow: none;
}

.scene.lamp-off .login-card {
    animation: none;
}

/* RESPONSIVE */

@media(max-width:850px) {
    .scene {
        justify-content: center;
    }

    .lamp-section {
        position: absolute;
        left: -100px;
        width: 65%;
        opacity: .5;
    }

    .login-section {
        margin: 0;
        width: 390px;
    }
}

@media(max-width:480px) {
    .login-card {
        padding: 30px 22px;
    }

    h1 {
        font-size: 25px;
    }

    .lamp-section {
        left: -150px;
        opacity: .3;
    }
}
</style>
</head>

<body>

<div class="scene" id="scene">

    <!-- BACKGROUND PARTICLES -->
    <div class="particles" id="particles"></div>

    <!-- LAMP -->
    <div class="lamp-section">
        <div class="lamp">

            <div class="light-cone"></div>
            <div class="lamp-stand"></div>

            <div class="lamp-head">
                <div class="lamp-bulb"></div>
            </div>

            <!-- PULL CHAIN -->
            <div class="chain" id="lampChain">
                <div class="chain-ball" id="chainBall"></div>
            </div>

            <div class="lamp-base"></div>
            <div class="floor-light"></div>

        </div>
    </div>

    <!-- LOGIN FORM -->
    <div class="login-section">
        <div class="login-card">

            <!-- MR. IQAS ROBOT LOGO -->
            <div class="lock-icon">
                <svg viewBox="0 0 100 100"
                     xmlns="http://www.w3.org/2000/svg"
                     fill="none">

                    <defs>
                        <filter id="neonGlow">
                            <feGaussianBlur stdDeviation="2.5"
                                            result="blur"/>
                            <feMerge>
                                <feMergeNode in="blur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>

                    <g stroke="#00dfff"
                       stroke-width="2.5"
                       stroke-linecap="round"
                       stroke-linejoin="round"
                       filter="url(#neonGlow)">

                        <!-- Hood -->
                        <path d="M18 42 L25 20 L50 8
                                 L75 20 L82 42
                                 L75 70 L50 91
                                 L25 70 Z"/>

                        <path d="M25 42 L32 24 L50 15
                                 L68 24 L75 42
                                 L68 67 L50 83
                                 L32 67 Z"/>

                        <!-- Robot face -->
                        <path d="M35 36 L50 29 L65 36
                                 L68 61 L50 73
                                 L32 61 Z"/>

                        <!-- Central eye -->
                        <circle cx="50" cy="45" r="11"/>
                        <circle cx="50" cy="45" r="6"
                                fill="#00dfff"/>
                        <circle cx="50" cy="45" r="2.5"
                                fill="#ffffff"/>

                        <!-- Face details -->
                        <path d="M39 60 L45 64 L45 70
                                 M61 60 L55 64 L55 70"/>

                        <path d="M44 76 L50 80 L56 76"/>

                        <!-- Side armor -->
                        <path d="M27 46 L17 54 L24 66
                                 L33 62"/>
                        <path d="M73 46 L83 54 L76 66
                                 L67 62"/>

                        <!-- Bottom armor -->
                        <path d="M35 76 L29 84 L43 87"/>
                        <path d="M65 76 L71 84 L57 87"/>

                        <!-- Decorative lines -->
                        <path d="M12 31 L20 31"/>
                        <path d="M80 31 L88 31"/>
                        <path d="M20 17 L27 22"/>
                        <path d="M80 17 L73 22"/>

                    </g>
                </svg>
            </div>

            <!-- LOGIN VIEW -->
            <div id="loginView">

                <h1>Welcome <span>Back</span></h1>

                <p class="subtitle">
                    Sign in to continue to your dashboard
                </p>

                <form id="loginForm">

                    <div class="input-group">
                        <span class="input-icon">✉</span>
                        <input
                            type="email"
                            id="email"
                            placeholder="Email address"
                            required
                            autocomplete="email">
                    </div>

                    <div class="input-group">
                        <span class="input-icon">♙</span>
                        <input
                            type="password"
                            id="password"
                            placeholder="Password"
                            required
                            minlength="4"
                            autocomplete="current-password">

                        <span class="eye" id="togglePassword">◉</span>
                    </div>

                    <button class="sign-btn" type="submit">
                        Sign In &nbsp; →
                    </button>

                </form>

                <p class="switch-text">
                    Don't have an account?
                    <button
                        class="text-btn"
                        type="button"
                        id="showRegister">
                        Create account
                    </button>
                </p>

            </div>

            <!-- REGISTRATION VIEW -->
            <div id="registerView" class="hidden-view">

                <h1>Create <span>Account</span></h1>

                <p class="subtitle">
                    Register to get started
                </p>

                <form id="registerForm">

                    <div class="input-group">
                        <span class="input-icon">♙</span>
                        <input
                            type="text"
                            id="registerName"
                            placeholder="Full name"
                            required
                            minlength="2"
                            autocomplete="name">
                    </div>

                    <div class="input-group">
                        <span class="input-icon">✉</span>
                        <input
                            type="email"
                            id="registerEmail"
                            placeholder="Email address"
                            required
                            autocomplete="email">
                    </div>

                    <div class="input-group">
                        <span class="input-icon">♙</span>
                        <input
                            type="password"
                            id="registerPassword"
                            placeholder="Create password"
                            required
                            minlength="4"
                            autocomplete="new-password">
                    </div>

                    <div class="input-group">
                        <span class="input-icon">♙</span>
                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm password"
                            required
                            minlength="4"
                            autocomplete="new-password">
                    </div>

                    <button class="sign-btn" type="submit">
                        Create Account &nbsp; →
                    </button>

                </form>

                <p class="switch-text">
                    Already have an account?
                    <button
                        class="text-btn"
                        type="button"
                        id="showLogin">
                        Sign in
                    </button>
                </p>

            </div>

            <!-- LOGGED-IN VIEW -->
            <div id="accountView" class="hidden-view">

                <h1>Hello, <span id="accountName">User</span></h1>

                <p class="subtitle">
                    You have successfully signed in.
                </p>

                <button
                    class="sign-btn"
                    type="button"
                    id="logoutButton">
                    Log Out
                </button>

            </div>

            <div
                class="message"
                id="message"
                role="status"
                aria-live="polite">
            </div>

        </div>
    </div>

</div>

<script>

// ==================================
// ELEMENTS
// ==================================

const scene = document.getElementById("scene");
const lampChain = document.getElementById("lampChain");
const chainBall = document.getElementById("chainBall");
const message = document.getElementById("message");


// ==================================
// LAMP STATE
// ==================================

let lampIsOn = true;

function toggleLamp() {

    lampIsOn = !lampIsOn;

    if (lampIsOn) {
        scene.classList.remove("lamp-off");
    } else {
        scene.classList.add("lamp-off");
    }
}


// ==================================
// REAL PULL CHAIN SYSTEM
// ==================================

let isDragging = false;
let startY = 0;
let currentPull = 0;

const PULL_LIMIT = 35;
const MAX_PULL = 65;

// Start pulling
chainBall.addEventListener("pointerdown", function(e) {

    e.preventDefault();

    isDragging = true;
    startY = e.clientY;
    currentPull = 0;

    chainBall.setPointerCapture(e.pointerId);
    lampChain.classList.add("pulling");

});

// Move chain down
chainBall.addEventListener("pointermove", function(e) {

    if (!isDragging) return;

    const distance = e.clientY - startY;

    currentPull = Math.max(
        0,
        Math.min(distance, MAX_PULL)
    );

    lampChain.style.transform =
        `translateY(${currentPull}px)`;

});

// Release chain
function releaseChain() {

    if (!isDragging) return;

    isDragging = false;

    // Only downward pull activates switch
    if (currentPull >= PULL_LIMIT) {
        toggleLamp();
    }

    // Return chain to original position
    lampChain.classList.remove("pulling");

    lampChain.style.transform =
        "translateY(0px)";

    currentPull = 0;
}

chainBall.addEventListener("pointerup", releaseChain);
chainBall.addEventListener("pointercancel", releaseChain);


// ==================================
// BACKGROUND PARTICLES
// ==================================

const particleContainer =
    document.getElementById("particles");

for (let i = 0; i < 65; i++) {

    const p = document.createElement("div");

    p.className = "particle";

    p.style.left = Math.random() * 100 + "%";
    p.style.top = Math.random() * 100 + "%";

    p.style.animationDelay =
        Math.random() * 7 + "s";

    p.style.animationDuration =
        (4 + Math.random() * 6) + "s";

    particleContainer.appendChild(p);
}


// ==================================
// PASSWORD SHOW / HIDE
// ==================================

const password = document.getElementById("password");
const togglePassword =
    document.getElementById("togglePassword");

togglePassword.addEventListener("click", function() {

    if (password.type === "password") {

        password.type = "text";
        togglePassword.textContent = "◎";

    } else {

        password.type = "password";
        togglePassword.textContent = "◉";

    }
});


// ==================================
// ACCOUNT / VIEW ELEMENTS
// ==================================

const loginView = document.getElementById("loginView");
const registerView = document.getElementById("registerView");
const accountView = document.getElementById("accountView");

const showRegisterButton =
    document.getElementById("showRegister");

const showLoginButton =
    document.getElementById("showLogin");

const logoutButton =
    document.getElementById("logoutButton");

const USERS_KEY = "neonLampUsers";
const SESSION_KEY = "neonLampCurrentUser";


// Get saved users
function getUsers() {

    try {
        return JSON.parse(
            localStorage.getItem(USERS_KEY)
        ) || [];

    } catch (error) {
        return [];
    }
}


// Change view
function showView(view) {

    loginView.classList.toggle(
        "hidden-view",
        view !== "login"
    );

    registerView.classList.toggle(
        "hidden-view",
        view !== "register"
    );

    accountView.classList.toggle(
        "hidden-view",
        view !== "account"
    );

    message.textContent = "";
}


// Show account
function showAccount(user) {

    document.getElementById("accountName").textContent =
        user.name;

    showView("account");
}


// ==================================
// SWITCH LOGIN / REGISTER
// ==================================

showRegisterButton.addEventListener("click", function() {
    showView("register");
});

showLoginButton.addEventListener("click", function() {
    showView("login");
});


// ==================================
// CREATE ACCOUNT / REGISTRATION
// ==================================

document.getElementById("registerForm")
.addEventListener("submit", function(e) {

    e.preventDefault();

    const name =
        document.getElementById("registerName")
        .value.trim();

    const email =
        document.getElementById("registerEmail")
        .value.trim()
        .toLowerCase();

    const newPassword =
        document.getElementById("registerPassword").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;


    // Check password confirmation
    if (newPassword !== confirmPassword) {

        message.textContent =
            "Passwords do not match.";

        return;
    }


    const users = getUsers();


    // Check existing email
    if (users.some(user => user.email === email)) {

        message.textContent =
            "An account with this email already exists.";

        return;
    }


    // Save new account
    users.push({
        name: name,
        email: email,
        password: newPassword
    });

    localStorage.setItem(
        USERS_KEY,
        JSON.stringify(users)
    );


    document.getElementById("registerForm").reset();

    document.getElementById("email").value = email;

    showView("login");

    message.textContent =
        "Account created successfully. Please sign in.";

});


// ==================================
// LOGIN TO CREATED ACCOUNT
// ==================================

document.getElementById("loginForm")
.addEventListener("submit", function(e) {

    e.preventDefault();

    const email =
        document.getElementById("email")
        .value.trim()
        .toLowerCase();

    const enteredPassword =
        document.getElementById("password").value;


    const user = getUsers().find(
        item =>
            item.email === email &&
            item.password === enteredPassword
    );


    if (!user) {

        message.textContent =
            "Incorrect email or password.";

        return;
    }


    // Save session
    sessionStorage.setItem(
        SESSION_KEY,
        JSON.stringify({
            name: user.name,
            email: user.email
        })
    );


    document.getElementById("loginForm").reset();

    showAccount(user);

});


// ==================================
// LOG OUT
// ==================================

logoutButton.addEventListener("click", function() {

    sessionStorage.removeItem(SESSION_KEY);

    showView("login");

    message.textContent =
        "You have been logged out.";

});


// ==================================
// RESTORE SESSION
// ==================================

try {

    const savedSession = JSON.parse(
        sessionStorage.getItem(SESSION_KEY)
    );

    if (savedSession && savedSession.name) {
        showAccount(savedSession);
    }

} catch (error) {

    sessionStorage.removeItem(SESSION_KEY);

}


// ==================================
// SOCIAL LOGIN DEMO
// ==================================

function socialLogin(provider) {

    message.textContent =
        provider + " login is not configured.";

}

</script>

</body>
</html>
